# Deploy config for git-deploy-toolkit (github.com/WentTheFox/GitDeployToolkit).
# Sourced by the shared post-receive hook after each push to `deploy`,
# with cwd set to this worktree. See that repo's template/deploy.conf.example
# for the full contract ($WORKTREE/$BRANCH/$GIT_DIR/$oldrev/$newrev).
#
# Ported from the old setup/post-receive.sh: reinstall dependencies only
# when the lockfile changed, rebuild only when something the build reads
# changed, always run migrations, then restart the pm2 process.

# changed <regex>: did a file matching it change in this push? On a first
# push ($oldrev all zeros) there's nothing to diff against, so everything
# counts. (grep > /dev/null, not grep -q: -q exits early, git diff dies of
# SIGPIPE, and pipefail would turn a match into "not changed".)
changed() {
  [[ "$oldrev" =~ ^0+$ ]] && return 0
  git --git-dir="$GIT_DIR" diff --name-only "$oldrev" "$newrev" | grep "$1" > /dev/null
}

deploy_build() {
  if changed '^package-lock\.json$'; then
    npm ci
  else
    echo "git-deploy: skipping npm ci, lockfile not modified"
  fi

  # The old script meant to rebuild on lockfile changes too, but its pattern
  # ("package-lock.json/") could never match a file.
  if changed '^\(src/\|package-lock\.json$\|tsconfig\.json$\)'; then
    nice npm run build
  else
    echo "git-deploy: skipping build, src/, package-lock.json and tsconfig.json unchanged"
  fi

  # Migrations run from migrations/*.ts via ts-node, independent of the build.
  npm run db up
}

deploy_restart() {
  pm2 restart pm2.json
}
